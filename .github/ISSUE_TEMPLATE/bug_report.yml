name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal synthetic input. Never paste real logs or credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Application version, Python version, and operating system.
    validations:
      required: true
