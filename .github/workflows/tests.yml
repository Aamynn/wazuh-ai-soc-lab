name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m soc_lab --input sample-data/ssh-sequence.jsonl
      - run: python -m soc_lab --input sample-data/benign-logins.jsonl
      - name: Verify generated report
        run: |
          python -m soc_lab --input sample-data/ssh-sequence.jsonl --format markdown > /tmp/report.md
          diff -u docs/examples/ssh-investigation.md /tmp/report.md
      - name: Install package and verify bundled resources outside checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          soc-lab --version
          soc-lab --input "$GITHUB_WORKSPACE/sample-data/ssh-sequence.jsonl" --format markdown > installed-report.md
          diff -u "$GITHUB_WORKSPACE/docs/examples/ssh-investigation.md" installed-report.md
